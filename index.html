<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Geovanna ❤️</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================
           PÁGINA
        ========================= */

        body {

            min-height: 100vh;

            background: #ffd9e7;

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           MURAL
        ========================= */

        .mural {

            position: relative;

            width: 1000px;

            height: 700px;

            margin: 40px auto 0;
        }


        /* =========================
           FOTO PRINCIPAL
        ========================= */

        .imagem-principal {

            position: absolute;

            width: 400px;
            height: 520px;

            object-fit: cover;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 10px solid white;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

            z-index: 3;
        }


        /* =========================
           FOTO ESQUERDA - CIMA
        ========================= */

        .foto-esquerda-1 {

            position: absolute;

            width: 200px;
            height: 240px;

            object-fit: cover;

            left: 70px;
            top: 70px;

            transform: rotate(-9deg);

            border: 8px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            z-index: 2;
        }


        /* =========================
           FOTO ESQUERDA - BAIXO
        ========================= */

        .foto-esquerda-2-container {

            position: absolute;

            width: 200px;
            height: 280px;

            left: 70px;
            bottom: 35px;

            transform: rotate(7deg);

            z-index: 4;
        }


        .foto-esquerda-2 {

            width: 200px;
            height: 240px;

            object-fit: cover;

            border: 8px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            display: block;
        }


        /* =========================
           TEXTO EM CIMA DA FOTO
        ========================= */

        .texto-foto {

            position: absolute;

            width: 300px;

            left: 50%;
            top: -45px;

            transform: translateX(-50%);

            text-align: center;

            font-size: 21px;

            font-weight: bold;

            color: #5a3041;

            white-space: nowrap;

            z-index: 10;
        }


        /* =========================
           FOTO DIREITA
        ========================= */

        .foto-direita {

            position: absolute;

            width: 200px;
            height: 240px;

            object-fit: cover;

            right: 70px;
            top: 220px;

            transform: rotate(9deg);

            border: 8px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            z-index: 2;
        }


        /* =========================
           TEXTO FINAL
        ========================= */

        .texto-final {

            width: 800px;

            margin: 80px auto 150px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.7);

            border-radius: 20px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15);

            text-align: center;

            color: #5a3041;
        }


        .texto-final h1 {

            margin-bottom: 25px;

            font-size: 32px;
        }


        .texto-final p {

            font-size: 20px;

            line-height: 1.7;

            text-align: left;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 900px) {

            .mural {

                transform: scale(0.75);

                transform-origin: top center;

                margin-bottom: -150px;
            }


            .texto-final {

                width: 90%;

                margin-top: 20px;

                padding: 25px;
            }


            .texto-final h1 {

                font-size: 26px;
            }


            .texto-final p {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         MURAL COM AS FOTOS
    ====================================== -->

    <div class="mural">


        <!-- FOTO ESQUERDA - CIMA -->

        <img
            src="foto2.jpg"
            alt="Foto especial"
            class="foto-esquerda-1"
        >


        <!-- FOTO PRINCIPAL -->

        <img
            src="foto.jpg"
            alt="Foto principal"
            class="imagem-principal"
        >


        <!-- FOTO ESQUERDA - BAIXO -->

        <div class="foto-esquerda-2-container">

            <div class="texto-foto">
                Geovanna Be like:
            </div>

            <img
                src="foto3.jpg"
                alt="Foto especial"
                class="foto-esquerda-2"
            >

        </div>


        <!-- FOTO DIREITA -->

        <img
            src="foto4.jpg"
            alt="Foto especial"
            class="foto-direita"
        >

    </div>



    <!-- =====================================
         TEXTO QUE APARECE DEPOIS DAS FOTOS
    ====================================== -->

    <div class="texto-final">

        <h1>
            Meu título aqui ❤️
        </h1>


        <p>

            ESCREVA SEU TEXTO AQUI.

            <br><br>

            Você pode escrever quantos parágrafos quiser.

            <br><br>

            Conforme o texto ficar maior, a página vai
            aumentar automaticamente e a pessoa poderá
            arrastar para baixo no celular ou usar o
            scroll do mouse no computador.

        </p>

    </div>


</body>

</html>
