<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Geovanna ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffd6e7;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* =========================
           MURAL
        ========================= */

        .mural {
            position: relative;

            width: 900px;
            height: 650px;
        }


        /* =========================
           FOTO PRINCIPAL
        ========================= */

        .imagem-principal {
            position: absolute;

            width: 390px;
            height: 500px;

            object-fit: cover;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 10px solid white;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25);

            z-index: 3;
        }


        /* =========================
           FOTOS LATERAIS
        ========================= */

        .foto-lateral {
            position: absolute;

            width: 190px;
            height: 230px;

            object-fit: cover;

            border: 8px solid white;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            z-index: 2;
        }


        /* =========================
           FOTO ESQUERDA - CIMA
        ========================= */

        .foto-esquerda-1 {
            left: 40px;
            top: 50px;

            transform: rotate(-8deg);
        }


        /* =========================
           FOTO ESQUERDA - BAIXO
        ========================= */

        .foto-com-texto {
            position: absolute;

            left: 40px;
            bottom: 45px;

            width: 190px;

            z-index: 4;

            transform: rotate(7deg);
        }

        .foto-com-texto .foto-lateral {
            position: relative;

            left: 0;
            top: 0;

            width: 190px;
            height: 230px;

            transform: none;
        }


        /* =========================
           TEXTO DA FOTO
        ========================= */

        .texto-foto {
            position: absolute;

            top: -38px;
            left: 50%;

            transform: translateX(-50%);

            width: max-content;

            font-size: 20px;
            font-weight: bold;

            color: #5a3041;

            white-space: nowrap;

            z-index: 10;
        }


        /* =========================
           FOTO DIREITA
        ========================= */

        .foto-direita {
            right: 40px;
            top: 185px;

            transform: rotate(9deg);
        }


        /* =========================
           EFEITO NAS FOTOS
        ========================= */

        .foto-lateral,
        .imagem-principal {
            transition: transform 0.3s ease;
        }


        .foto-esquerda-1:hover {
            transform: rotate(-8deg) scale(1.04);
        }


        .foto-com-texto:hover {
            transform: rotate(7deg) scale(1.04);
        }


        .foto-direita:hover {
            transform: rotate(9deg) scale(1.04);
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            .mural {
                width: 100%;
                height: 750px;
                transform: scale(0.75);
            }

        }

    </style>
</head>


<body>

    <div class="mural">


        <!-- =========================
             FOTO DA ESQUERDA - CIMA
        ========================== -->

        <img
            class="foto-lateral foto-esquerda-1"
            src="foto2.jpg"
            alt="Foto especial"
        >


        <!-- =========================
             FOTO PRINCIPAL
        ========================== -->

        <img
            class="imagem-principal"
            src="foto.jpg"
            alt="Foto principal"
        >


        <!-- =========================
             FOTO DA ESQUERDA - BAIXO
        ========================== -->

        <div class="foto-com-texto">

            <div class="texto-foto">
                Geovanna Be like:
            </div>

            <img
                class="foto-lateral"
                src="foto3.jpg"
                alt="Foto especial"
            >

        </div>


        <!-- =========================
             FOTO DA DIREITA
        ========================== -->

        <img
            class="foto-lateral foto-direita"
            src="foto4.jpg"
            alt="Foto especial"
        >

    </div>

</body>
</html>
